name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "linkedin-crawler-ui/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkedin-crawler-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "linkedin-crawler-ui/package-lock.json"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        continue-on-error: true
        run: npm run lint || true

      - name: Build Next.js
        env:
          NEXT_PUBLIC_LINKEDIN_CRAWLER_API_URL: ${{ secrets.NEXT_PUBLIC_LINKEDIN_CRAWLER_API_URL }}
          NEXT_PUBLIC_LINKEDIN_CRAWLER_API_KEY: ${{ secrets.NEXT_PUBLIC_LINKEDIN_CRAWLER_API_KEY }}
          LINKEDIN_CRAWLER_INTERNAL_API_URL: ${{ secrets.LINKEDIN_CRAWLER_INTERNAL_API_URL }}
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: vercel/action@main
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./linkedin-crawler-ui
          scope: ${{ secrets.VERCEL_ORG_SLUG }}

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Frontend deployed to Vercel! Check the deployment at: ${{ steps.deploy.outputs.preview-url }}'
            })
