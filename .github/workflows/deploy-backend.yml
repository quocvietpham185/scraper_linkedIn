name: Deploy Backend to Render

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "linkedin_group_crawler/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/linkedin-scraper-api

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkedin_group_crawler

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run linting (pylint)
        continue-on-error: true
        run: |
          pip install pylint
          pylint app --disable=all --enable=E,F || true

      - name: Run tests
        continue-on-error: true
        run: |
          pytest tests/ -v --tb=short || true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./linkedin_group_crawler/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        run: |
          curl --no-buffer --remote-name -H "accept: application/json" -H "authorization: Bearer ${{ secrets.RENDER_API_KEY }}" https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys -X POST
        continue-on-error: true

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -f https://linkedin-scraper-api.onrender.com/health 2>/dev/null | grep -q "status"; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ Attempt $i/30: Waiting for health endpoint..."
            sleep 10
          done
          echo "⚠️ Health check timeout, but deployment may still be in progress"
          exit 0
