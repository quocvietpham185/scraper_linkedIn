services:
  - type: web
    name: linkedin-scraper-api
    runtime: docker
    dockerfilePath: ./linkedin_group_crawler/Dockerfile
    region: oregon
    healthCheckPath: /health
    
    envVars:
      - key: HEADLESS
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: CORS_ORIGINS
        value: https://your-vercel-domain.vercel.app,https://your-custom-domain.com
      - key: STATE_PATH
        value: /app/storage/linkedin_state.json
      - key: USE_PERSISTENT_PROFILE
        value: "true"
      - key: TMPDIR
        value: /app/tmp
      - key: TEMP
        value: /app/tmp
      - key: TMP
        value: /app/tmp
      - key: APIFY_FALLBACK_ENABLED
        value: "true"
      - key: API_KEY
        sync: false

      # Set these in the Render dashboard or during Blueprint creation.
      - key: APIFY_TOKEN
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false

    disk:
      - path: /app/storage
        sizeGb: 1
      - path: /app/data
        sizeGb: 2

    plan: free

    preDeployCommand: echo "Preparing deployment..."
    buildCommand: |
      cd linkedin_group_crawler && \
      pip install --no-cache-dir -r requirements.txt
